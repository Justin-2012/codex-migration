[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-migration"
version = "0.1.0"
description = "Local, encrypted, resumable Codex computer migration"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.24,<1", "PyYAML>=6,<7"]

[project.scripts]
codex-migration = "codex_migration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_migration = ["assets/*.json"]
